<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ProbleX · NeonScape</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css">
<style>
:root{--ink:#16191f;--mute:#6b7280;--line:#e5e7eb;--bg:#fff;--soft:#f3f4f6;--r:14px;--sh:0 8px 30px rgba(15,23,42,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;font:14px/1.45 Inter,system-ui,sans-serif;color:var(--ink)}
#map{position:absolute;inset:0;background:#eceff1}
.leaflet-draw-toolbar,.leaflet-draw-section{display:none}
.pin i{display:block;width:20px;height:20px;margin:4px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .15s}
.pin.sel i{transform:scale(1.4)}
#panel{position:fixed;z-index:1000;top:16px;right:16px;bottom:16px;width:min(380px,calc(100vw - 64px));border-radius:18px;background:var(--bg);box-shadow:var(--sh);display:flex;flex-direction:column;transition:transform .25s ease}
#panel.peek{transform:translateX(calc(100% + 16px))}
#head{padding:10px 14px 0;border-bottom:1px solid var(--line);flex:none}
#head h1{font-size:15px;font-weight:600;margin:0 0 10px;letter-spacing:-.01em;display:flex;align-items:baseline;justify-content:space-between}
.ns,.brand b{font-weight:700;background:linear-gradient(90deg,#00c2ff,#7a5cff 55%,#ff3d9a);-webkit-background-clip:text;background-clip:text;color:transparent}
.ns{font-size:12px}
.brand{margin-top:14px;text-align:center;font-size:12px;color:var(--mute)}
.leaflet-control-layers{border:0!important;border-radius:12px!important;box-shadow:var(--sh)!important}
#grab{position:absolute;left:-44px;top:50%;margin-top:-36px;width:44px;height:72px;border:0;border-radius:14px 0 0 14px;background:#fff;box-shadow:-4px 4px 16px rgba(15,23,42,.14);font:600 26px/1 Inter,sans-serif;color:var(--ink);cursor:pointer}
#tabs{display:flex;gap:4px}
#tabs button{flex:1;min-height:44px;border:0;background:none;font:inherit;font-weight:500;color:var(--mute);border-bottom:2px solid transparent;cursor:pointer}
#tabs button.on{color:var(--ink);border-color:var(--ink)}
#body{flex:1;overflow:auto;border-radius:0 0 18px 18px;padding:14px;-webkit-overflow-scrolling:touch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font:inherit;font-weight:500;color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.dng{color:#dc2626}
.btn.full{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.btns .btn{flex:1}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:10px 12px;margin-top:8px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;cursor:pointer;min-height:56px}
.row:hover{background:var(--soft)}
.row small{display:block;color:var(--mute)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.empty{color:var(--mute);padding:18px 4px;text-align:center}
.io{display:flex;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.io .btn{flex:1;font-size:13px}
.card h2{font-size:18px;margin:8px 0 6px;letter-spacing:-.01em}
.card h3{font-size:12px;font-weight:600;color:var(--mute);margin:16px 0 4px}
.card p{margin:0;white-space:pre-wrap}
.tag{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;background:var(--soft);font-size:12px;margin-right:6px}
.ph{width:100%;height:190px;object-fit:cover;border-radius:12px;display:block;cursor:zoom-in;background:var(--soft)}
.back{border:0;background:none;font:inherit;color:var(--mute);padding:6px 0;min-height:36px;cursor:pointer}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:14px 0 4px}
input[type=text],textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid #2563eb;outline-offset:1px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font:inherit;cursor:pointer;display:flex;align-items:center;gap:8px}
.chip.on{border-color:var(--ink);background:var(--soft);font-weight:500}
#bar{position:fixed;z-index:1100;top:12px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:8px;padding:8px 8px 8px 16px;background:var(--ink);color:#fff;border-radius:99px;box-shadow:var(--sh);max-width:calc(100vw - 24px)}
#bar .btn{min-height:38px;padding:0 14px;border-radius:99px;border:0}
#lb{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center}
#lb img{max-width:96vw;max-height:92vh;border-radius:8px}
@media(max-width:760px){#panel{top:0;bottom:0;right:0;width:min(88vw,380px);border-radius:18px 0 0 18px}#panel.peek{transform:translateX(100%)}#body{padding-bottom:calc(14px + env(safe-area-inset-bottom))}#bar{top:calc(12px + env(safe-area-inset-top))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="map"></div>
<div id="bar"><span id="barTxt"></span><span id="barBtns" style="display:flex;gap:6px"></span></div>
<aside id="panel" class="half">
  <div id="head">
    <button id="grab" aria-label="Свернуть меню">›</button>
    <h1>Городской блокнот <span class="ns">NeonScape</span></h1>
    <div id="tabs"></div>
  </div>
  <div id="body"></div>
</aside>
<div id="lb"><img alt=""></div>
<input type="file" id="pf" accept="image/*" hidden>
<input type="file" id="imp" accept="application/json,.json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"></script>
<script>
const CATS={transport:['Транспорт','#2563eb'],green:['Благоустройство','#16a34a'],light:['Освещение','#d97706'],barrier:['Барьеры','#dc2626']};
const TYPES={point:['Точки','Точка','точку'],line:['Линии','Линия','линию'],zone:['Зоны','Зона','зону']};
const KEY='urban-notebook-v1';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mobile=()=>matchMedia('(max-width:760px)').matches;

const DEMO=[
 {id:'d1',type:'point',cat:'light',title:'Тёмный подземный переход',photo:'',geo:[51.1585,71.4420],
  problem:'Переход освещён одной лампой из четырёх, вечером пешеходы выбирают путь по проезжей части. Нет ориентиров и видимости на выходе.',
  solution:'Установить линейные светодиоды по всей длине перехода, добавить зеркальные панели и яркую навигацию на выходах.'},
 {id:'d2',type:'line',cat:'barrier',title:'Пешеходный маршрут без тротуара',photo:'',geo:[[51.1578,71.4400],[51.1582,71.4440],[51.1590,71.4475]],
  problem:'Тротуар обрывается на середине квартала, дальше люди идут по газону и парковке. Маршрут к остановке удлиняется на 150 м.',
  solution:'Достроить тротуар шириной 2,5 м с понижением бордюров на пересечениях, убрать три парковочных места у начала участка.'},
 {id:'d3',type:'zone',cat:'green',title:'Пустырь во дворе',photo:'',geo:[[51.1595,71.4440],[51.1595,71.4465],[51.1604,71.4465],[51.1604,71.4440]],
  problem:'Незастроенная территория используется как стихийная парковка и свалка, нет ни скамеек, ни озеленения.',
  solution:'Превратить в двор-сквер: детская и спортивная площадки, деревья по периметру, зона тихого отдыха и парковочный карман с краю.'}
];
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s)}catch(e){}return JSON.parse(JSON.stringify(DEMO))}
let items=load(),layers={},ui={tab:'point',id:null,mode:'list',sheet:matchMedia('(max-width:760px)').matches?'peek':'half',photo:'',cat:'transport',isNew:false};
const get=id=>items.find(o=>o.id===id);
function persist(){try{localStorage.setItem(KEY,JSON.stringify(items))}catch(e){alert('Не удалось сохранить: память браузера заполнена. Экспортируйте данные в JSON и удалите лишние фото.')}}

/* ---- map ---- */
/* Вид закреплён на исследуемом участке (границы выгрузки OSM). Чтобы вернуть свободное движение карты, поставьте LOCKED=false */
const LOCKED=true,AREA=[[51.1563830,71.4379120],[51.1609250,71.4506360]];
const map=L.map('map',{zoomControl:!LOCKED,zoomSnap:LOCKED?0:1,dragging:!LOCKED,scrollWheelZoom:!LOCKED,doubleClickZoom:!LOCKED,touchZoom:!LOCKED,boxZoom:!LOCKED,keyboard:!LOCKED,maxZoom:20});
function fitArea(){map.invalidateSize();map.fitBounds(AREA,{paddingBottomRight:[matchMedia('(max-width:760px)').matches?0:396,0],animate:false})}
fitArea();
if(LOCKED)addEventListener('resize',fitArea);
const cartoAttr='© OpenStreetMap © CARTO';
const base={
  'Спутник':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:20,attribution:'Esri, Maxar, Earthstar Geographics'}),
  'Подробная':L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:19,maxZoom:20,attribution:'Esri, HERE, Garmin, OpenStreetMap'}),
  'Цветная':L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:cartoAttr}),
  'Светлая':L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,attribution:cartoAttr})
};
base['Спутник'].addTo(map);
const over={'Подписи улиц':L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:20,pane:'shadowPane',attribution:cartoAttr})};
L.control.layers(base,over,{position:'bottomleft',collapsed:true}).addTo(map);
map.attributionControl.setPrefix('Создано командой <b>NeonScape</b>');

function icon(o,sel){return L.divIcon({className:'pin'+(sel?' sel':''),html:`<i style="background:${CATS[o.cat][1]}"></i>`,iconSize:[28,28],iconAnchor:[14,14]})}
function paint(o){
  if(layers[o.id])map.removeLayer(layers[o.id]);
  const c=CATS[o.cat][1],sel=ui.id===o.id;let l;
  if(o.type==='point')l=L.marker(o.geo,{icon:icon(o,sel)});
  else if(o.type==='line')l=L.polyline(o.geo,{color:c,weight:sel?8:6,opacity:.9,lineCap:'round'});
  else l=L.polygon(o.geo,{color:c,weight:sel?3:2,fillColor:c,fillOpacity:sel?.35:.22});
  l.on('click',e=>{L.DomEvent.stopPropagation(e);if(!editingGeo)select(o.id)});
  l.addTo(map);layers[o.id]=l;
}
function geoOf(o,l){return o.type==='point'?[l.getLatLng().lat,l.getLatLng().lng]:(o.type==='line'?l.getLatLngs():l.getLatLngs()[0]).map(p=>[p.lat,p.lng])}
items.forEach(paint);

function fly(o){
  if(LOCKED)return;
  const l=layers[o.id],pad={paddingBottomRight:[ui.sheet==='peek'?0:Math.min(396,innerWidth*.88),0]};
  if(o.type==='point')map.flyToBounds(L.latLngBounds([o.geo,o.geo]).pad(.0005),{...pad,maxZoom:18,duration:.7});
  else map.flyToBounds(l.getBounds(),{...pad,maxZoom:18,duration:.7});
}
function select(id,doFly){
  const prev=ui.id;ui.id=id;ui.mode='view';
  const o=get(id);ui.tab=o.type;
  if(prev&&get(prev))paint(get(prev));
  paint(o);
  if(mobile())ui.sheet='half';
  if(doFly)fly(o);
  render();
}

/* ---- top bar (drawing / geometry editing) ---- */
function bar(txt,btns){
  $('barTxt').textContent=txt;const b=$('barBtns');b.innerHTML='';
  btns.forEach(([t,f,pri])=>{const e=document.createElement('button');e.className='btn';e.textContent=t;if(pri)e.style.background='#fff',e.style.color='#16191f';else e.style.background='#374151',e.style.color='#fff';e.onclick=f;b.appendChild(e)});
  $('bar').style.display='flex';
}
const hideBar=()=>$('bar').style.display='none';

let handler=null,editingGeo=null;
function startDraw(type){
  if(handler)handler.disable();
  const c='#16191f',so={color:c,weight:6};
  if(type==='point')handler=new L.Draw.Marker(map,{icon:icon({cat:'transport'})});
  else if(type==='line')handler=new L.Draw.Polyline(map,{shapeOptions:so,showLength:false});
  else handler=new L.Draw.Polygon(map,{showArea:false,allowIntersection:false,shapeOptions:so});
  handler.enable();
  if(mobile()){ui.sheet='peek';render()}
  const btns=[['Отмена',()=>handler.disable()]];
  if(type!=='point')btns.unshift(['Готово',()=>handler.completeShape&&handler.completeShape(),true]);
  bar(type==='point'?'Нажмите на карту, чтобы поставить точку':'Ставьте вершины, затем «Готово»',btns);
}
map.on('draw:drawstop',hideBar);
map.on('draw:created',e=>{
  const type=e.layerType==='marker'?'point':e.layerType==='polyline'?'line':'zone';
  const l=e.layer,o={id:'o'+Date.now(),type,cat:'transport',title:'Новая '+TYPES[type][1].toLowerCase(),problem:'',solution:'',photo:'',geo:null};
  o.geo=geoOf(o,l);items.push(o);persist();paint(o);
  ui.isNew=true;ui.id=o.id;ui.tab=type;ui.mode='edit';ui.cat=o.cat;ui.photo='';
  if(mobile())ui.sheet='half';
  paint(o);render();
});
function startGeo(id){
  const o=get(id),l=layers[id];editingGeo=id;l.editing.enable();
  if(mobile()){ui.sheet='peek';render()}
  bar(o.type==='point'?'Перетащите маркер на новое место':'Двигайте вершины линии или зоны',[
    ['Отмена',()=>{l.editing.disable();editingGeo=null;paint(o);hideBar();render()}],
    ['Готово',()=>{l.editing.disable();o.geo=geoOf(o,l);editingGeo=null;persist();paint(o);hideBar();if(mobile())ui.sheet='half';render()},true]]);
}

/* ---- panel ---- */
function chip(k,on){return `<button type="button" class="chip${on?' on':''}" data-act="cat" data-k="${k}"><span class="dot" style="background:${CATS[k][1]}"></span>${CATS[k][0]}</button>`}
function listHTML(){
  const t=ui.tab,list=items.filter(o=>o.type===t);
  return `<button class="btn pri full" data-act="add">+ Добавить ${TYPES[t][2]}</button>`+
  (list.length?list.map(o=>`<button class="row" data-act="open" data-id="${o.id}"><span class="dot" style="background:${CATS[o.cat][1]}"></span><span><b>${esc(o.title)}</b><small>${CATS[o.cat][0]}</small></span></button>`).join(''):`<div class="empty">Здесь пока пусто. Добавьте первый объект — отметьте его на карте.</div>`)+
  `<div class="io"><button class="btn" data-act="export">Экспорт в JSON</button><button class="btn" data-act="import">Импорт из JSON</button></div><div class="brand">Создано командой <b>NeonScape</b></div>`;
}
function viewHTML(o){
  return `<div class="card"><button class="back" data-act="back">← К списку</button>
  ${o.photo?`<img class="ph" data-act="zoom" src="${o.photo}" alt="Фото объекта">`:''}
  <h2>${esc(o.title)}</h2><span class="tag">${TYPES[o.type][1]}</span><span class="tag"><span class="dot" style="background:${CATS[o.cat][1]}"></span>${CATS[o.cat][0]}</span>
  <h3>В чём проблема</h3><p>${esc(o.problem)||'<span style="color:var(--mute)">Не заполнено</span>'}</p>
  <h3>Как решить</h3><p>${esc(o.solution)||'<span style="color:var(--mute)">Не заполнено</span>'}</p>
  <div class="btns"><button class="btn pri" data-act="edit">Редактировать</button><button class="btn" data-act="geo">Изменить положение</button><button class="btn dng" data-act="del">Удалить</button></div></div>`;
}
function editHTML(o){
  return `<div class="card"><label for="f-title" style="margin-top:4px">Название проблемы</label><input type="text" id="f-title" value="${esc(o.title)}">
  <label>Категория (${TYPES[o.type][1].toLowerCase()})</label><div class="chips">${Object.keys(CATS).map(k=>chip(k,k===ui.cat)).join('')}</div>
  <label>Фотография</label><div id="phbox">${ui.photo?`<img class="ph" src="${ui.photo}" alt="">`:''}</div>
  <div class="btns" style="margin-top:8px"><button class="btn" data-act="pick">${ui.photo?'Заменить фото':'Загрузить фото'}</button>${ui.photo?'<button class="btn dng" data-act="rmph">Убрать</button>':''}</div>
  <label for="f-prob">В чём проблема</label><textarea id="f-prob">${esc(o.problem)}</textarea>
  <label for="f-sol">Как решить</label><textarea id="f-sol">${esc(o.solution)}</textarea>
  <div class="btns"><button class="btn pri" data-act="save">Сохранить</button><button class="btn" data-act="cancel">Отмена</button></div></div>`;
}
function render(){
  $('panel').className=ui.sheet;$('grab').textContent=ui.sheet==='peek'?'‹':'›';$('grab').setAttribute('aria-label',ui.sheet==='peek'?'Открыть меню':'Свернуть меню');
  const list=ui.mode==='list';
  $('tabs').style.display=list?'flex':'none';
  $('tabs').innerHTML=Object.keys(TYPES).map(k=>`<button class="${ui.tab===k?'on':''}" data-act="tab" data-k="${k}">${TYPES[k][0]} ${items.filter(o=>o.type===k).length}</button>`).join('');
  const o=get(ui.id);
  if(!list&&!o){ui.mode='list';return render()}
  $('body').innerHTML=list?listHTML():ui.mode==='view'?viewHTML(o):editHTML(o);
}

$('tabs').onclick=e=>{const b=e.target.closest('[data-act=tab]');if(b){ui.tab=b.dataset.k;render()}};
$('grab').onclick=()=>{ui.sheet=ui.sheet==='peek'?'half':'peek';render()};
$('lb').onclick=()=>$('lb').style.display='none';
$('body').onclick=e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,o=get(ui.id);
  if(a==='add')startDraw(ui.tab);
  else if(a==='open')select(b.dataset.id,true);
  else if(a==='back'){const p=ui.id;ui.id=null;ui.mode='list';if(p&&get(p))paint(get(p));render()}
  else if(a==='edit'){ui.mode='edit';ui.isNew=false;ui.cat=o.cat;ui.photo=o.photo;render()}
  else if(a==='geo')startGeo(o.id);
  else if(a==='zoom'){$('lb').querySelector('img').src=o.photo;$('lb').style.display='flex'}
  else if(a==='del'){if(confirm('Удалить «'+o.title+'»? Это действие нельзя отменить.'))removeObj(o)}
  else if(a==='cat'){ui.cat=b.dataset.k;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.k===ui.cat))}
  else if(a==='pick')$('pf').click();
  else if(a==='rmph'){ui.photo='';render()}
  else if(a==='save'){
    o.title=$('f-title').value.trim()||'Без названия';o.problem=$('f-prob').value;o.solution=$('f-sol').value;o.cat=ui.cat;o.photo=ui.photo;
    persist();paint(o);ui.isNew=false;ui.mode='view';render();
  }
  else if(a==='cancel'){if(ui.isNew)removeObj(o);else{ui.mode='view';render()}}
  else if(a==='export')exportJSON();
  else if(a==='import')$('imp').click();
};
function removeObj(o){
  if(layers[o.id])map.removeLayer(layers[o.id]);delete layers[o.id];
  items=items.filter(x=>x.id!==o.id);persist();ui.id=null;ui.mode='list';ui.isNew=false;ui.tab=o.type;render();
}

/* ---- photo: downscale to keep localStorage small ---- */
$('pf').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    ui.photo=c.toDataURL('image/jpeg',.75);
    const t=$('f-title')?.value,p=$('f-prob')?.value,s=$('f-sol')?.value,o=get(ui.id);
    if(o){o.title=t||o.title;o.problem=p??o.problem;o.solution=s??o.solution}
    render();
  };im.onerror=()=>alert('Не удалось прочитать изображение.');im.src=r.result};
  r.readAsDataURL(f);
};

/* ---- export / import ---- */
function exportJSON(){
  const blob=new Blob([JSON.stringify({app:'urban-notebook',version:1,items},null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='urban-analysis-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
$('imp').onchange=e=>{
  const f=e.target.files[0];e.target.value='';if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const d=JSON.parse(r.result),arr=Array.isArray(d)?d:d.items;
    if(!Array.isArray(arr))throw 0;
    const ok=arr.filter(o=>o&&TYPES[o.type]&&CATS[o.cat]&&o.geo&&o.id).map(o=>({id:String(o.id),type:o.type,cat:o.cat,title:o.title||'Без названия',problem:o.problem||'',solution:o.solution||'',photo:o.photo||'',geo:o.geo}));
    if(!ok.length)throw 0;
    const replace=confirm('Импортировано объектов: '+ok.length+'.\nОК — заменить текущие данные.\nОтмена — добавить к существующим.');
    items.forEach(o=>layers[o.id]&&map.removeLayer(layers[o.id]));layers={};
    items=replace?ok:items.filter(o=>!ok.some(n=>n.id===o.id)).concat(ok);
    persist();items.forEach(paint);ui.id=null;ui.mode='list';render();
    const all=L.featureGroup(Object.values(layers));if(!LOCKED&&all.getLayers().length)map.fitBounds(all.getBounds(),{padding:[40,40]});
  }catch(err){alert('Файл не подходит: нужен JSON, экспортированный из этого приложения.')}};
  r.readAsText(f);
};

map.on('click',()=>{if(ui.mode==='view'&&!editingGeo){const p=ui.id;ui.id=null;ui.mode='list';if(p&&get(p))paint(get(p));render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&handler)handler.disable()});
render();
</script>
